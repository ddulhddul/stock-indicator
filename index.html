<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시장 위험 지표</title>
<style>
  :root { --bg:#f6f6f4; --panel:#ffffff; --fg:#1d1d1b; --muted:#6b6b66; --line:#e3e2dc;
          --ok:#2f7d4f; --warn:#b7791f; --bad:#b83a3a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --panel:#1f1f1d; --fg:#ececea; --muted:#9a9a94; --line:#33332f;
            --ok:#5cb37f; --warn:#e0a648; --bad:#e06a6a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  header { max-width:1200px; margin:0 auto; padding:24px 16px 8px; }
  h1 { font-size:22px; margin:0 0 4px; }
  header p { margin:0; color:var(--muted); font-size:14px; }
  main { max-width:1200px; margin:0 auto; padding:16px; display:grid; gap:16px;
         grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr)); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .card-head { padding:14px 16px 10px; }
  .card-head h2 { font-size:16px; margin:0 0 6px; }
  .zones { display:flex; flex-wrap:wrap; gap:6px; font-size:12px; }
  .zones span { padding:2px 8px; border-radius:999px; border:1px solid var(--line); }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .chart { height:clamp(480px, 72vh, 760px); border-top:1px solid var(--line); }
  .card-foot { padding:8px 16px 12px; font-size:12px; color:var(--muted); }
  .card-foot a { color:inherit; }
  footer { max-width:1200px; margin:0 auto; padding:0 16px 32px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>시장 위험 지표</h1>
  <p>차트는 TradingView 실시간 위젯입니다. 기준선은 흔히 쓰는 참고 구간이며 투자 판단 기준이 아닙니다.</p>
</header>
<main id="grid"></main>
<footer>지표 추가: 파일 아래쪽 INDICATORS 목록에 한 줄을 추가하세요.</footer>

<script>
/* ===== 지표 목록: 여기에 한 줄씩 추가하면 카드가 늘어납니다 =====
   symbol : TradingView 심볼 (TradingView 검색창에서 확인)
   fred   : FRED 코드 (있으면 원본 링크 표시, 없으면 null)
   zones  : 참고 구간 [표시문구, ok|warn|bad]                         */
const INDICATORS = [
  {
    name: "VIX 변동성 지수",
    symbol: "FRED:VIXCLS",
    fred: "VIXCLS",
    zones: [["15 미만 안정","ok"],["20 이상 경계","warn"],["30 이상 공포","bad"]]
  },
  {
    name: "미국 하이일드 스프레드 (%)",
    symbol: "FRED:BAMLH0A0HYM2",
    fred: "BAMLH0A0HYM2",
    zones: [["3% 미만 낙관","ok"],["5% 이상 경계","warn"],["7% 이상 위기","bad"]]
  },
  // 예시) 장단기 금리차:
  // { name:"미국 10년-2년 금리차", symbol:"FRED:T10Y2Y", fred:"T10Y2Y", zones:[["0 미만 역전","warn"]] },
];

const dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
const grid = document.getElementById("grid");

INDICATORS.forEach((ind, i) => {
  const card = document.createElement("section");
  card.className = "card";

  const head = document.createElement("div");
  head.className = "card-head";
  const h2 = document.createElement("h2");
  h2.textContent = ind.name;
  const zones = document.createElement("div");
  zones.className = "zones";
  (ind.zones || []).forEach(([label, tone]) => {
    const s = document.createElement("span");
    s.className = tone; s.textContent = label; zones.appendChild(s);
  });
  head.append(h2, zones);

  const chart = document.createElement("div");
  chart.className = "chart tradingview-widget-container";
  const inner = document.createElement("div");
  inner.className = "tradingview-widget-container__widget";
  inner.style.height = "100%";
  chart.appendChild(inner);
  const s = document.createElement("script");
  s.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
  s.async = true;
  s.text = JSON.stringify({
    autosize: true, symbol: ind.symbol, interval: "D", range: "12M",
    timezone: "Asia/Seoul", theme: dark ? "dark" : "light", style: "2",
    locale: "kr", hide_top_toolbar: false, allow_symbol_change: false,
    save_image: false, support_host: "https://www.tradingview.com"
  });
  chart.appendChild(s);

  const foot = document.createElement("div");
  foot.className = "card-foot";
  foot.textContent = "심볼 " + ind.symbol;
  if (ind.fred) {
    foot.append(" · ");
    const a = document.createElement("a");
    a.href = "https://fred.stlouisfed.org/series/" + ind.fred;
    a.target = "_blank"; a.rel = "noopener";
    a.textContent = "FRED 원본";
    foot.appendChild(a);
  }

  card.append(head, chart, foot);
  grid.appendChild(card);
});
</script>
</body>
</html>
